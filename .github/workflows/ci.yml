name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            -skip-testing:FineTuneUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/TestResults.xcresult

      - name: Build Release app
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER=com.finetuneapp.FineTune.dev \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
          mv build/DerivedData/Build/Products/Release/FineTune.app "build/FineTune Dev.app"
          # Hardened runtime refuses to load the vendor-signed Sparkle into an ad-hoc app
          # ("different Team IDs"), so the artifact would crash on launch.
          codesign --force --deep --sign - "build/FineTune Dev.app/Contents/Frameworks/Sparkle.framework"
          codesign --force --sign - --preserve-metadata=entitlements,requirements "build/FineTune Dev.app"
          codesign --verify --deep --strict "build/FineTune Dev.app"
          ditto -c -k --keepParent "build/FineTune Dev.app" build/FineTune.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: FineTune-app
          path: build/FineTune.zip
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
